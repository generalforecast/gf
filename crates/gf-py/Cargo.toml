[package]
name = "gf-py"
description = "Python bindings for gf-core, built as generalforecast._core"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
arrow-array = "60"
arrow-ipc = "60"
arrow-select = "60"
gf-core = { path = "../gf-core" }
gf-server = { path = "../gf-server" }
numpy = "0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
pyo3 = { version = "0.29", features = ["abi3-py312"] }

[lints]
workspace = true
