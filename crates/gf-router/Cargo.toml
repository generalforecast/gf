[package]
name = "gf-router"
description = "generalforecast's router: places tables on nodes and forwards clients to them"
version = "0.1.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "gf-router"
path = "src/main.rs"

[dependencies]
arrow-array = "60"
arrow-cast = "60"
arrow-flight = "60"
arrow-schema = "60"
arrow-select = "60"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
gf-core = { path = "../gf-core" }
gf-server = { path = "../gf-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tracing = "0.1"

[dev-dependencies]
# Paused clocks, so tests of leases and failover need not wait.
tokio = { version = "1", features = ["full", "test-util"] }

[lints]
workspace = true
